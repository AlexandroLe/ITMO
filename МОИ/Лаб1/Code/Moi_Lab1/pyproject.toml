[project]
name = "moi-lab1"
version = "0.1.0"
description = "Lab 1 for image processing: brightness on a triangle surface"
requires-python = ">=3.10"

[project.scripts]
moi-lab1 = "image_lab1.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

